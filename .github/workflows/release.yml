# タグ push (`v*`) をトリガーに各プラットフォーム向けバイナリをビルドし、
# GitHub Release へ添付する。
#
# 配布名 (`nebula-<プラットフォーム>` / `nebula-backend-<プラットフォーム>`) は
# crates/nebula/src/update.rs の `resolve_asset_name` が組み立てる名前と
# 文字列で完全一致していなければならない。片方だけ変えると `nebula update` は
# 「リリースに必要なファイルが見つかりません」で必ず失敗する。
# ズレたことに気づけるよう、update.rs の
# `リリースワークフローの配布プラットフォームと解決結果が一致する` が
# このファイルを実際に読んで突き合わせている。行を増減させるときは
# そのテストも一緒に見ること。
#
# 動作確認について: このリポジトリにはまだ Release が 1 つも無く、
# このワークフローは一度も実行されていない。手で試すときは
# workflow_dispatch から流すこと (手動実行は必ず下書きとして作られるので、
# 公開せずに成否だけ確かめられる)。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 作成するタグ名 (例 v0.1.0)。手動実行は必ず下書きになる
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest は Apple Silicon ランナー。Intel 向けは同じランナーから
          # クロスビルドする。Intel の macOS ランナーは順次退役しているため、
          # 専用ランナーを当てにしない。
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            native: true
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
            native: false
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            native: true
            ext: ""
          # Windows は実行ファイルに `.exe` が付く。配布名にも付けたままにするのは、
          # 手で download した利用者がそのまま実行できるようにするため。
          # update.rs の `resolve_asset_name` もこの名前を組み立てている。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            native: true
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.platform }}

      # タグは任意のコミットに付けられる。CI が通っていないコミットから
      # 配布物を作らないよう、ここでもテストを通す。クロスビルドした
      # バイナリはこのランナーでは動かせないので native のときだけ。
      - name: テスト
        if: matrix.native
        run: cargo test --workspace --locked

      - name: ビルド
        run: cargo build --release --workspace --bins --locked --target ${{ matrix.target }}

      - name: 配布名へ揃える
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in nebula nebula-backend; do
            cp "target/${{ matrix.target }}/release/${bin}${EXT}" \
               "dist/${bin}-${{ matrix.platform }}${EXT}"
          done
          # Windows のバイナリに実行ビットの概念は無いが、Git Bash 上でも
          # chmod は成功する (何も起きない) ので分岐は要らない。
          chmod +x dist/*

      # native のときだけ、作った実行ファイルが本当に起動するか確かめる。
      # リンクは通ったが共有ライブラリが足りず起動しない、という配布事故を防ぐ。
      # GUI は画面が要るので、画面の要らないバックエンドだけを起こして落とす。
      #
      # 「起動した」の判定は待ち受けが開いたかどうかで見る。その確かめ方が
      # プラットフォームで違う (ソケットファイルの有無 / パイプ名前空間の走査)
      # ため、ステップを 2 つに分けている。
      - name: 起動できることを確かめる (Unix)
        if: matrix.native && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SOCK="${RUNNER_TEMP}/nebula-smoke-$$.sock"
          "dist/nebula-backend-${{ matrix.platform }}" --endpoint "$SOCK" &
          PID=$!
          for _ in $(seq 1 100); do
            [ -S "$SOCK" ] && break
            sleep 0.1
          done
          if [ ! -S "$SOCK" ]; then
            echo "バックエンドがソケットを開けませんでした" >&2
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          echo "バックエンドは起動してソケットを開いた"
          kill "$PID"
          wait "$PID" 2>/dev/null || true

      - name: 起動できることを確かめる (Windows)
        if: matrix.native && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "nebula-smoke-$PID"
          $backend = Start-Process -PassThru -NoNewWindow `
            -FilePath "dist/nebula-backend-${{ matrix.platform }}.exe" `
            -ArgumentList '--endpoint', "\\.\pipe\$name"
          # 名前付きパイプはファイルシステムに実体を持たないので、
          # パイプ名前空間そのものを列挙して名前の有無を見る。
          $opened = $false
          for ($i = 0; $i -lt 100; $i++) {
            if ([System.IO.Directory]::GetFiles('\\.\pipe\') -match [regex]::Escape($name)) {
              $opened = $true
              break
            }
            Start-Sleep -Milliseconds 100
          }
          if (-not $opened) {
            Write-Error 'バックエンドが名前付きパイプを開けませんでした'
            $backend | Stop-Process -Force
            exit 1
          }
          Write-Host 'バックエンドは起動して名前付きパイプを開いた'
          $backend | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: チェックサムを添える
        shell: bash
        run: |
          cd dist
          # `nebula-*` は nebula-backend-* にも当たるので、これだけで全部並ぶ。
          # 両方を並べると同じファイルが二重に載る。
          sha256sum nebula-* > SHA256SUMS
          cat SHA256SUMS

      - name: リリースを作ってバイナリを添付する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # 手動実行は動作確認が目的なので、公開せず下書きに留める。
          DRAFT=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAFT=(--draft)
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes \
            "${DRAFT[@]}" \
            dist/*
