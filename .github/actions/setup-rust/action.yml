name: Rust ビルド環境の用意
description: >
  ツールチェーンと、GPUI が各プラットフォームで要求するビルド依存を入れる。
  CI とリリースの両方から使う。同じ手順を 2 つのワークフローに書き写すと、
  片方だけ直したときに「CI は通るのにリリースだけ落ちる」が起きるので 1 箇所にまとめる。

inputs:
  toolchain:
    description: 入れるツールチェーン (既定は stable。最低要求バージョンの検査だけ版を指定する)
    required: false
    default: stable
  targets:
    description: 追加で入れる rustup ターゲット (クロスビルド用。空なら host のみ)
    required: false
    default: ""
  cache-key:
    description: キャッシュを分けるための接尾辞
    required: false
    default: ""

runs:
  using: composite
  steps:
    # `components` を明示するのは、この action が minimal profile で入れるため。
    # ランナーに rustfmt / clippy が最初から入っていることに頼ると、
    # イメージが変わった日に CI の門番だけが静かに消える。
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: rustfmt, clippy

    - name: Linux — GPUI のビルド依存を入れる
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # Wayland / X11 / xkbcommon は GPUI のウィンドウ実装が、
        # fontconfig と freetype は font-kit が、Vulkan は blade-graphics が要求する。
        # 実行時にしか要らないものも含めて入れておく (CI で足りない方が高くつく)。
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config cmake clang \
          libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
          libfontconfig1-dev libfreetype6-dev \
          libvulkan-dev libvulkan1 \
          libasound2-dev libssl-dev

    - name: macOS — Metal ツールチェーンを用意する
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # GPUI の build.rs は `xcrun -sdk macosx metal` でシェーダを事前
        # コンパイルする (crates/gpui build.rs の compile_metal_shaders)。
        # Xcode 16 以降、Metal ツールチェーンは Xcode 本体と別配布になり、
        # ランナーのイメージによっては入っていない。
        if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
          echo "metal は利用できる"
        else
          echo "metal が見つからないのでダウンロードする"
          xcodebuild -downloadComponent MetalToolchain
        fi

    # Windows に追加で入れるものは無い。GPUI が要求する DirectX・DirectWrite と、
    # release ビルドで HLSL シェーダをコンパイルする `fxc.exe` は、ランナーに
    # 最初から入っている Windows SDK が持っている。ここに分岐が無いのは
    # 「書き忘れ」ではなく「要らない」ことの記録。

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
