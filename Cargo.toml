[workspace]
resolver = "3"
members = [
    "crates/nebula-protocol",
    "crates/nebula-core",
    "crates/nebula-backend",
    "crates/nebula",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ishibashi-futos/nebula-code"

[workspace.dependencies]
nebula-protocol = { path = "crates/nebula-protocol" }
nebula-core = { path = "crates/nebula-core" }

gpui = "0.2.2"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "process",
    "sync",
    "time",
    "fs",
] }
notify = "8.2"
ignore = "0.4"
lsp-types = "0.97"
portable-pty = "0.9"

# シグナルマスク/ハンドラの初期化に使う。std に相当する API が無い。
libc = "0.2"

# Windows の名前付きパイプを重畳 (overlapped) I/O で読み書きし、古いバックエンドの
# 終了を待つ/強制終了するために使う。Unix 側で libc を使っているのと同じ理由で、
# std に相当する API が無い。GUI 側は gpui の executor を持ち込めない生スレッドから
# 同期的に読み書きするため、tokio の名前付きパイプ実装は使えない。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
vte = "0.15"

# UAX #29 (書記素境界) と UAX #11 (表示幅) の実装。カーソル移動と端末セル幅の
# 正しさに直結し、自前実装は Unicode データテーブルの維持を伴うため外部クレートを使う。
unicode-segmentation = "1.13"
unicode-width = "0.2"

tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"

# 冷間起動 200ms 以下を狙うため、リリースビルドは単一 CGU + LTO で最適化する。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false

# 依存クレートは常に最適化しておく（デバッグ実行でも実用速度を保つため）。
[profile.dev.package."*"]
opt-level = 2
